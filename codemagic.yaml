# iPhone (iOS) cloud build on Codemagic — for when you have an Apple Developer account.
# Codemagic runs on Macs, so you don't need one. Steps are in GUIDE (iOS section).
workflows:
  ios-testflight:
    name: iOS build to TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: NaijaRoadRush ASC key   # must match the name you give the key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.awwalng.naijaroadrush
      node: 22
      xcode: latest
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy game into the iOS project
        script: npx cap sync ios
      - name: Set build number
        script: cd ios/App && agvtool new-version -all $BUILD_NUMBER
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  android-apk:
    name: Android test APK (alternative to GitHub)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install packages
        script: npm ci
      - name: Copy game into the Android project
        script: npx cap sync android
      - name: Build APK
        script: cd android && chmod +x gradlew && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
