name: Build 3D cars (TripoSR, CPU)

# Turns car pictures into game-ready 3D models with TripoSR (MIT licence) on a free CPU runner.
# Input: lines of "name|https://image-url" (one car per line).
on:
  workflow_dispatch:
    inputs:
      cars:
        description: 'One or more "name|image_url" entries separated by spaces'
        required: true
      mc_resolution:
        description: 'Marching cubes resolution (detail)'
        default: '256'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install TripoSR (CPU)
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git tsr
          pip install -q torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -q omegaconf==2.3.0 Pillow==10.1.0 einops==0.7.0 transformers==4.35.0 trimesh==4.0.5 "rembg[cpu]" huggingface-hub imageio fast-simplification numpy==1.26.4 onnxruntime scipy scikit-build-core cmake ninja pybind11
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
      - name: Download pictures
        run: |
          mkdir -p in
          for e in ${{ inputs.cars }}; do n="${e%%|*}"; u="${e#*|}"; curl -sSL "$u" -o "in/$n.png"; file "in/$n.png"; done
      - name: Generate meshes
        run: |
          cd tsr
          for f in ../in/*.png; do n=$(basename "$f" .png); mkdir -p "../out/$n"
            python run.py "$f" --device cpu --mc-resolution ${{ inputs.mc_resolution }} --foreground-ratio 0.88 --model-save-format glb --output-dir "../out/$n" 2>&1 | grep -vE "Warning|warn" | tail -5
          done
          find ../out -type f | head -20
      - name: Clean up and decimate for phones
        run: |
          mkdir -p hd/public/models/raw
          python3 - <<'EOF'
          import glob, os, trimesh, numpy as np, fast_simplification
          for d in sorted(glob.glob('out/*')):
              name = os.path.basename(d); src = glob.glob(d + '/**/*.glb', recursive=True)
              if not src: print('no mesh for', name); continue
              m = trimesh.load(src[0], force='mesh')
              cols = m.visual.vertex_colors[:, :3] if hasattr(m.visual, 'vertex_colors') else None
              print(name, 'faces', len(m.faces))
              # keep the largest connected piece (drops floating specks), then reduce to ~16k faces
              parts = m.split(only_watertight=False); m = max(parts, key=lambda p: len(p.faces)) if len(parts) > 1 else m
              target = 16000
              if len(m.faces) > target:
                  ratio = 1 - target / len(m.faces)
                  v, f, coll = fast_simplification.simplify(m.vertices, m.faces, ratio, return_collapses=True)
                  # carry colours over by nearest original vertex
                  from scipy.spatial import cKDTree
                  idx = cKDTree(m.vertices).query(v)[1]; c = m.visual.vertex_colors[idx]
                  m = trimesh.Trimesh(v, f, vertex_colors=c, process=False)
              m.export(f'hd/public/models/raw/{name}-tsr.glb'); print(name, '->', len(m.faces), 'faces', os.path.getsize(f'hd/public/models/raw/{name}-tsr.glb') // 1024, 'KB')
          EOF
      - name: Commit models
        run: |
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add hd/public/models/raw/*-tsr.glb && git commit -m "Add TripoSR car models [skip ci]" && git pull --rebase && git push || echo "nothing to commit"
