# Downloads 3D models / images listed in tools/assets/fetch.json into the repository.
name: Fetch assets
on:
  workflow_dispatch:
  push:
    paths: ['tools/assets/**']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          for a in json.load(open('tools/assets/fetch.json')):
              os.makedirs(os.path.dirname(a['out']), exist_ok=True)
              if os.path.exists(a['out']) and not a.get('force'): print('skip', a['out']); continue
              req = urllib.request.Request(a['url'], headers={'User-Agent': 'Mozilla/5.0'})
              data = urllib.request.urlopen(req, timeout=120).read()
              open(a['out'], 'wb').write(data); print('saved', a['out'], len(data))
          PY
      - name: Save to repository
        run: |
          git config user.name "asset-bot"; git config user.email "actions@users.noreply.github.com"
          git add hd/public
          git commit -m "Fetched assets [skip ci]" || echo "no changes"
          git push
